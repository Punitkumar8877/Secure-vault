<!DOCTYPE html>
<html lang="en">
<head>
    <title>File Sharing Logs</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="logs-container">
        <h2>📋 File Sharing Logs</h2>
        <table>
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Shared With</th>
                    <th>Shared By</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                    <tr>
                        <td>{{ log[1] }}</td>
                        <td>{{ log[2] }}</td>
                        <td>{{ log[3] }}</td>
                        <td>{{ log[4] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>

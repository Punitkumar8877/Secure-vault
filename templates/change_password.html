<!DOCTYPE html>
<html lang="en">
<head>
    <title>Change Password - Secure Vault</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="change-password-container">
        <div class="card">
            <h2>🔒 Change Password</h2>
            <p class="description">Ensure your account stays secure with a strong password.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="change-password-form">
                <div class="input-group">
                    <label for="current_password">Current Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="current_password" id="current_password" placeholder="Enter current password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="new_password">New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" name="new_password" id="new_password" placeholder="Enter new password" required>
                    </div>
                    <div id="password-strength" class="strength-indicator"></div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle"></i>
                        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password" required>
                    </div>
                </div>

                <button type="submit" class="change-btn">✅ Update Password</button>
            </form>

            <a href="/dashboard" class="back-btn">⬅️ Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Password Strength Indicator
        const newPasswordInput = document.getElementById('new_password');
        const strengthIndicator = document.getElementById('password-strength');

        newPasswordInput.addEventListener('input', () => {
            const value = newPasswordInput.value;
            if (value.length > 8 && /[A-Z]/.test(value) && /\d/.test(value) && /[@$!%*?&]/.test(value)) {
                strengthIndicator.textContent = '✅ Strong Password';
                strengthIndicator.style.color = 'green';
            } else if (value.length >= 6) {
                strengthIndicator.textContent = '⚠️ Medium Strength';
                strengthIndicator.style.color = 'orange';
            } else {
                strengthIndicator.textContent = '❗ Weak Password';
                strengthIndicator.style.color = 'red';
            }
        });
    </script>
</body>
</html>

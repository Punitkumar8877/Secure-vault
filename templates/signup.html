<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Secure Vault</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 10px; font-weight: bold; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; }
        button { background-color: #4CAF50; color: #fff; border: none; padding: 10px; border-radius: 5px; margin-top: 15px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        p { text-align: center; margin-top: 15px; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Sign Up</h2>
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <button type="submit">Sign Up</button>
        </form>

        <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</body>
</html>
